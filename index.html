<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گیم ماریو</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom, #87CEEB, #98FB98);
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        
        h1 {
            color: #FF6B35;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        #gameContainer {
            display: inline-block;
            border: 3px solid #8B4513;
            border-radius: 10px;
            background: #87CEEB;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
        }
        
        #controls {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.8);
            border-radius: 10px;
            display: inline-block;
        }
        
        #score {
            font-size: 24px;
            color: #FF6B35;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .control-text {
            color: #333;
            font-size: 16px;
            margin: 5px 0;
        }
        
        .key {
            background: #FF6B35;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <h1>🎮 گیم ماریو 🎮</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
    
    <div id="controls">
        <div id="score">امتیاز: <span id="scoreValue">0</span></div>
        <div class="control-text">
            حرکت: <span class="key">←</span> <span class="key">→</span>
        </div>
        <div class="control-text">
            پرش: <span class="key">Space</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreValue');
        
        let score = 0;
        
        // ماریو
        const mario = {
            x: 50,
            y: 300,
            width: 30,
            height: 40,
            velocityX: 0,
            velocityY: 0,
            onGround: false,
            color: '#FF0000'
        };
        
        // سکه‌ها
        const coins = [
            { x: 200, y: 250, width: 20, height: 20, collected: false },
            { x: 350, y: 200, width: 20, height: 20, collected: false },
            { x: 500, y: 150, width: 20, height: 20, collected: false },
            { x: 650, y: 250, width: 20, height: 20, collected: false }
        ];
        
        // سکوها
        const platforms = [
            { x: 0, y: 340, width: 800, height: 60 },
            { x: 150, y: 280, width: 100, height: 20 },
            { x: 300, y: 230, width: 100, height: 20 },
            { x: 450, y: 180, width: 100, height: 20 },
            { x: 600, y: 280, width: 100, height: 20 }
        ];
        
        // فیزیک
        const gravity = 0.8;
        const jumpPower = -15;
        const moveSpeed = 5;
        
        // کنترل‌ها
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        function updateMario() {
            // حرکت افقی
            if (keys['ArrowLeft']) {
                mario.velocityX = -moveSpeed;
            } else if (keys['ArrowRight']) {
                mario.velocityX = moveSpeed;
            } else {
                mario.velocityX *= 0.8; // اصطکاک
            }
            
            // پرش
            if (keys['Space'] && mario.onGround) {
                mario.velocityY = jumpPower;
                mario.onGround = false;
            }
            
            // اعمال گرانش
            mario.velocityY += gravity;
            
            // به‌روزرسانی موقعیت
            mario.x += mario.velocityX;
            mario.y += mario.velocityY;
            
            // برخورد با مرزهای صفحه
            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;
            
            // برخورد با سکوها
            mario.onGround = false;
            for (let platform of platforms) {
                if (mario.x < platform.x + platform.width &&
                    mario.x + mario.width > platform.x &&
                    mario.y + mario.height > platform.y &&
                    mario.y < platform.y + platform.height) {
                    
                    if (mario.velocityY > 0) {
                        mario.y = platform.y - mario.height;
                        mario.velocityY = 0;
                        mario.onGround = true;
                    }
                }
            }
            
            // برخورد با سکه‌ها
            for (let coin of coins) {
                if (!coin.collected &&
                    mario.x < coin.x + coin.width &&
                    mario.x + mario.width > coin.x &&
                    mario.y < coin.y + coin.height &&
                    mario.y + mario.height > coin.y) {
                    
                    coin.collected = true;
                    score += 10;
                    scoreElement.textContent = score;
                }
            }
        }
        
        function drawMario() {
            ctx.fillStyle = mario.color;
            ctx.fillRect(mario.x, mario.y, mario.width, mario.height);
            
            // کلاه ماریو
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(mario.x + 5, mario.y - 5, 20, 10);
            
            // چشم‌ها
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(mario.x + 8, mario.y + 8, 4, 4);
            ctx.fillRect(mario.x + 18, mario.y + 8, 4, 4);
            
            // سبیل
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(mario.x + 5, mario.y + 20, 20, 3);
        }
        
        function drawCoins() {
            ctx.fillStyle = '#FFD700';
            for (let coin of coins) {
                if (!coin.collected) {
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // علامت $ روی سکه
                    ctx.fillStyle = '#8B4513';
                    ctx.font = '12px Arial';
                    ctx.fillText('$', coin.x + 6, coin.y + 15);
                    ctx.fillStyle = '#FFD700';
                }
            }
        }
        
        function drawPlatforms() {
            ctx.fillStyle = '#8B4513';
            for (let platform of platforms) {
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // بافت چوب
                ctx.fillStyle = '#A0522D';
                for (let i = 0; i < platform.width; i += 20) {
                    ctx.fillRect(platform.x + i, platform.y, 2, platform.height);
                }
                ctx.fillStyle = '#8B4513';
            }
        }
        
        function drawBackground() {
            // ابرها
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(100, 80, 30, 0, Math.PI * 2);
            ctx.arc(130, 80, 35, 0, Math.PI * 2);
            ctx.arc(160, 80, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(500, 60, 25, 0, Math.PI * 2);
            ctx.arc(530, 60, 30, 0, Math.PI * 2);
            ctx.arc(560, 60, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // خورشید
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(700, 50, 30, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function gameLoop() {
            // پاک کردن صفحه
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // رسم عناصر
            drawBackground();
            drawPlatforms();
            drawCoins();
            drawMario();
            
            // به‌روزرسانی ماریو
            updateMario();
            
            // ادامه حلقه بازی
            requestAnimationFrame(gameLoop);
        }
        
        // شروع بازی
        gameLoop();
    </script>
</body>
</html>
